<aside class="bt-sidebar" id="btSidebar" role="navigation" aria-label="Main navigation">

  <!-- Brand -->
  <a href="{% url 'dashboard' %}" class="bt-sidebar-brand">
    <div class="bt-sidebar-brand-icon">
      <i class="fa-solid fa-wallet"></i>
    </div>
    <div class="bt-sidebar-brand-text">
      <div class="bt-sidebar-brand-name">Budget<span>Track</span></div>
      <div class="bt-sidebar-brand-sub">Allowance System</div>
    </div>
  </a>

  <!-- Nav scroll area -->
  <div class="bt-sidebar-nav-wrap">
    <nav class="bt-nav" aria-label="App navigation">
      <div class="bt-nav-section-label">Main Menu</div>

      <a class="bt-nav-link {% if request.resolver_match.url_name == 'dashboard' %}bt-nav-link--active{% endif %}"
         href="{% url 'dashboard' %}">
        <span class="bt-nav-link-icon"><i class="fa-solid fa-chart-pie"></i></span>
        <span class="bt-nav-link-label">Dashboard</span>
      </a>

      <a class="bt-nav-link {% if request.resolver_match.url_name == 'my_allowance' %}bt-nav-link--active{% endif %}"
         href="{% url 'my_allowance' %}">
        <span class="bt-nav-link-icon"><i class="fa-solid fa-piggy-bank"></i></span>
        <span class="bt-nav-link-label">My Allowance</span>
      </a>

      <a class="bt-nav-link {% if request.resolver_match.url_name == 'expense_items' %}bt-nav-link--active{% endif %}"
         href="{% url 'expense_items' %}">
        <span class="bt-nav-link-icon"><i class="fa-solid fa-cart-shopping"></i></span>
        <span class="bt-nav-link-label">Expenses</span>
      </a>

      <a class="bt-nav-link {% if request.resolver_match.url_name == 'goals' %}bt-nav-link--active{% endif %}"
         href="{% url 'goals' %}">
        <span class="bt-nav-link-icon"><i class="fa-solid fa-bullseye"></i></span>
        <span class="bt-nav-link-label">Goals</span>
      </a>

      <a class="bt-nav-link {% if request.resolver_match.url_name == 'transaction_list' %}bt-nav-link--active{% endif %}"
         href="{% url 'transaction_list' %}">
        <span class="bt-nav-link-icon"><i class="fa-solid fa-list-ul"></i></span>
        <span class="bt-nav-link-label">List</span>
      </a>

      <a class="bt-nav-link {% if request.resolver_match.url_name == 'profile' %}bt-nav-link--active{% endif %}"
         href="{% url 'profile' %}">
        <span class="bt-nav-link-icon"><i class="fa-solid fa-user-circle"></i></span>
        <span class="bt-nav-link-label">Profile</span>
      </a>
    </nav>
  </div>

  <!-- User card (pinned to bottom) -->
  <div class="bt-sidebar-user">
    <a href="{% url 'profile' %}" class="bt-sidebar-user-avatar" title="View profile">
      {{ user.username|first|upper }}
    </a>
    <div class="bt-sidebar-user-info">
      <div class="bt-sidebar-user-name">{{ user.get_full_name|default:user.username }}</div>
      <div class="bt-sidebar-user-role">{% if user.is_superuser %}Administrator{% else %}Student{% endif %}</div>
    </div>
    <a href="{% url 'logout' %}" class="bt-sidebar-user-logout" title="Sign out">
      <i class="fa-solid fa-right-from-bracket"></i>
    </a>
  </div>

</aside>
