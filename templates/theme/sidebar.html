<aside class="navbar navbar-vertical navbar-expand-lg bt-sidebar" id="btSidebar" role="navigation" aria-label="Main navigation">
  <div class="container-fluid flex-column h-100 p-0">

    <!-- Brand -->
    <a href="{% url 'dashboard' %}" class="bt-brand">
      <div class="bt-brand-icon">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div>
        <div class="bt-brand-name">Budget<span>Track</span></div>
        <div class="bt-brand-sub">Allowance System</div>
      </div>
    </a>

    <!-- Nav items -->
    <div class="flex-grow-1 overflow-auto py-2">
      <nav class="bt-nav navbar-nav d-flex flex-column">
        <span class="bt-nav-section">Main Menu</span>

        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
           href="{% url 'dashboard' %}">
          <span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span>
          Dashboard
        </a>

        <a class="nav-link {% if request.resolver_match.url_name == 'my_allowance' %}active{% endif %}"
           href="{% url 'my_allowance' %}">
          <span class="nav-icon"><i class="fa-solid fa-piggy-bank"></i></span>
          My Allowance
        </a>

        <a class="nav-link {% if request.resolver_match.url_name == 'expense_items' %}active{% endif %}"
           href="{% url 'expense_items' %}">
          <span class="nav-icon"><i class="fa-solid fa-cart-shopping"></i></span>
          Expenses
        </a>

        <a class="nav-link {% if request.resolver_match.url_name == 'goals' %}active{% endif %}"
           href="{% url 'goals' %}">
          <span class="nav-icon"><i class="fa-solid fa-bullseye"></i></span>
          Goals
        </a>

        <a class="nav-link {% if request.resolver_match.url_name == 'transaction_list' %}active{% endif %}"
           href="{% url 'transaction_list' %}">
          <span class="nav-icon"><i class="fa-solid fa-list-ul"></i></span>
          List
        </a>

        <a class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
           href="{% url 'profile' %}">
          <span class="nav-icon"><i class="fa-solid fa-user-circle"></i></span>
          Profile
        </a>

      </nav>
    </div>

    <!-- User footer -->
    <div class="bt-user-footer">
      <a href="{% url 'profile' %}" class="bt-user-avatar text-decoration-none" title="Profile">
        {{ user.username|first|upper }}
      </a>
      <div class="min-w-0 flex-grow-1">
        <div class="bt-user-name">{{ user.get_full_name|default:user.username }}</div>
        <div class="bt-user-role">{% if user.is_superuser %}Administrator{% else %}Student{% endif %}</div>
      </div>
      <a href="{% url 'logout' %}" class="bt-user-logout" title="Sign out">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
    </div>

  </div>
</aside>
