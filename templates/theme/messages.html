{% if messages %}
{% for message in messages %}
<div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}info{% endif %} alert-dismissible fade show" role="alert">
  <i class="fas {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %} alert-icon" aria-hidden="true"></i>
  <div>
    <h4 class="alert-heading">{% if message.tags == 'error' %}Error{% elif message.tags == 'warning' %}Warning{% else %}Success{% endif %}</h4>
    <div class="alert-description">
      {{ message }}
    </div>
  </div>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endfor %}
{% endif %}
